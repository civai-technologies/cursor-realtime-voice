<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Voice</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>Cursor Voice</h1>
        <p class="sub">
          Speak to send instructions into your open <strong>Cursor Agent</strong> chat. Recent agent replies
          (when hooks are installed) appear as system lines and via <code>get_status</code>.
        </p>
      </header>

      <section class="settings" id="settingsPanel">
        <h2 class="settings-title">OpenAI API key</h2>
        <p class="settings-hint" id="keyHint">Checking…</p>
        <div class="settings-row">
          <input
            type="password"
            id="apiKeyInput"
            autocomplete="off"
            placeholder="sk-…"
            aria-label="OpenAI API key"
          />
          <button type="button" id="saveKeyBtn">Save key</button>
        </div>
        <p class="settings-note">Stored in <code>.env</code> on this machine only (loopback server).</p>
      </section>

      <section class="status" id="status">Not connected</section>
      <section class="captions" id="captions" aria-live="polite"></section>
      <footer class="actions">
        <button type="button" id="startBtn">Start voice</button>
        <button type="button" id="stopAgentBtn" disabled>Stop agent run</button>
        <button type="button" id="endBtn" disabled>End voice</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
